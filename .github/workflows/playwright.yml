name: Playwright Tests

on:
  # Run on every pull request
  pull_request:
    branches: [main, develop]

  # Run on pushes to main
  push:
    branches: [main]

  # Nightly full regression at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: false
        default: 'all'
        type: choice
        options: [all, chromium, firefox, webkit]
      suite:
        description: 'Test suite to run'
        required: false
        default: 'smoke'
        type: choice
        options: [smoke, regression, all]

env:
  # CI flag — used by playwright.config.ts for CI-specific settings
  CI: true
  NODE_VERSION: '20'

jobs:
  # ── Job 1: Code Quality Gate ─────────────────────────────────────────────────
  validate:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

  # ── Job 2: Smoke Tests (PR Gate — fast feedback) ────────────────────────────
  smoke:
    name: Smoke Tests (Chromium)
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://www.saucedemo.com' }}
      DEFAULT_USERNAME: ${{ secrets.DEFAULT_USERNAME || 'standard_user' }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD || 'secret_sauce' }}
      TEST_ENV: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: npm run test:smoke -- --project=chromium

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Job 3: Full Regression (main branch + scheduled) ─────────────────────────
  regression:
    name: Regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://www.saucedemo.com' }}
      DEFAULT_USERNAME: ${{ secrets.DEFAULT_USERNAME || 'standard_user' }}
      DEFAULT_PASSWORD: ${{ secrets.DEFAULT_PASSWORD || 'secret_sauce' }}
      TEST_ENV: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (${{ matrix.browser }})
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run regression tests (${{ matrix.browser }})
        run: npm run test:regression -- --project=${{ matrix.browser }}

      - name: Upload regression report (${{ matrix.browser }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
